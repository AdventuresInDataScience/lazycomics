# lazycomics — project configuration
#
# Three-tier resolution: function-call args override these values, which
# in turn override each module's hardcoded fallback. The values below
# match the hardcoded fallbacks exactly, so this file is purely
# documentary unless you edit it.
#
# `load_config()` searches: explicit path -> ./lazycomics_config.yaml ->
# ~/.lazycomics_config.yaml -> {}. From inside this repo the file is
# found via the cwd entry.


# ---------------------------------------------------------------------------
# Page assembly  (src/lazycomics/assembler.py)
# ---------------------------------------------------------------------------
assembly:
  # Height of one physical page in pixels. Width is derived from
  # `comic.aspect` in the CBML, so the page aspect is always preserved.
  page_height_px: 3000

  # Gap between adjacent panel cells, in pixels. No outer margin —
  # gutters only appear between cells.
  gutter_px: 20

  # Gutter and canvas background fill colour (hex).
  bg_color: "#ffffff"

  # Relative aspect drift allowed before switching from stretch to
  # the configured fit_mode when fitting a panel to its slot. 0.0 means
  # always use fit_mode unless the panel already matches the slot exactly.
  # 0.05 would allow 5% drift before non-stretch kicks in.
  stretch_tolerance: 0.0

  # How to fit a panel into its slot when aspects differ. Since the bridge
  # now generates panels at the requested aspect (§14.1), generated panels
  # match their slot and nothing is cropped or padded regardless of mode;
  # this only bites for hand-edited / third-party panels whose aspect differs.
  # Options:
  #   cover   — (default) scale to fill the slot, centre-crop any overflow.
  #             Fills edge-to-edge with no letterbox bands.
  #   contain — scale to fit inside the slot, letterbox-pad with bg_color.
  #             Preserves all content including edge text overlays; use for
  #             un-regeneratable panels that carry edge content.
  #   stretch — resize without preserving aspect. Distorts faces;
  #             only safe when panels are authored at the slot aspect.
  fit_mode: cover


# ---------------------------------------------------------------------------
# Enrichment  (src/lazycomics/enricher.py)
# ---------------------------------------------------------------------------
enricher:
  # How panels with 2+ characters are generated.
  #   auto    — (default) single combined pass when every character on the
  #             panel is LoRA-free (the inpaint path only adds drift when
  #             there's no per-character LoRA to apply); base + per-character
  #             inpaint passes when any character has a LoRA. Interaction
  #             keywords (hugging, fighting, ...) always force a single pass
  #             since inpaint would overwrite overlapping characters.
  #   single  — always one combined pass naming every character (no inpaint).
  #             Most robust against the "two disjointed halves" artifact;
  #             relies on the prompt + reference to separate the characters.
  #   inpaint — always base pass + one inpaint pass per non-primary character.
  #             Use when you have per-character LoRAs and want each applied in
  #             its own pass.
  multi_char_strategy: auto


# ---------------------------------------------------------------------------
# LLM-assisted prompt refinement  (src/lazycomics/llm_refiner.py)
# ---------------------------------------------------------------------------
# Used only if you call `refine_prompts_with_llm()`. Both `url` and
# `model` must be set for that function to run; the defaults below point
# at a local Ollama instance. For OpenAI / OpenRouter / vLLM / LM Studio,
# replace `url` with the relevant OpenAI-compatible endpoint and (where
# required) set `api_key`.
llm:
  url: http://localhost:11434/v1
  model: qwen2.5-coder:7b

  # Bearer token for hosted services. Leave null for local servers that
  # don't require auth (Ollama, llama.cpp server, LM Studio).
  api_key: null

  # Override the built-in system prompt sent to the LLM. Leave null to
  # use `DEFAULT_SYSTEM_PROMPT` from llm_refiner.py — that prompt is
  # tuned for Flux-family image models and works well in most cases.
  system_prompt: null


# ---------------------------------------------------------------------------
# Wan2GP generation bridge  (src/lazycomics/wan2gp_bridge.py)
# ---------------------------------------------------------------------------
# Required for `generate_panels()`. Both `wgp_root` and `python_bin`
# must point to your Pinokio-managed Wan2GP install — there are no
# fallback defaults for these since they depend on your local paths.
#
# To find them: open Pinokio, locate the Wan2GP app, and note its
# install directory. `python_bin` is the Python binary inside the
# env that Pinokio created (typically env/bin/python or env/Scripts/python).
wan2gp:
  # Absolute path to the Wan2GP repo root inside Pinokio.
  wgp_root: C:\pinokio\api\wan.git\app

  # Python binary inside the Pinokio-managed env for Wan2GP.
  python_bin: C:\pinokio\api\wan.git\app\env\Scripts\python.exe

  # Wan2GP model_type (flat key, not nested). Matches filename in defaults/
  # without .json. Use "Export Settings" in Wan2GP UI to verify.
  #
  # --- Trying full Flux Dev instead of Klein (Tier-3 consistency option) ---
  # Flux Dev has stronger prompt adherence and a more mature LoRA ecosystem
  # than Klein 9B, at higher VRAM and slower generation. If character/style
  # drift is unacceptable on Klein, it's worth a comparison. To switch:
  #   1. Find the exact Flux Dev model_type in Wan2GP (its defaults/*.json
  #      filename, or via Export Settings) and set `architecture` to it.
  #   2. Flux Dev typically wants more steps (e.g. default_steps: 20-28) and a
  #      guidance_scale around 3.5-4.0 — tune on a test page.
  #   3. To claw back the speed, drop `base_resolution` (e.g. 768) and lean on
  #      the Real-ESRGAN upscaler below to restore final page resolution.
  #   4. Benchmark before committing:
  #        python tools/profile_architectures.py <project_dir> flux2_klein_9b <flux_dev_model_type>
  #      (project must be enriched + prompted + refs-prepared first).
  architecture: flux2_klein_9b

  # Default denoising steps (Klein 9B uses 4 by default).
  default_steps: 4

  # Guidance scale. Klein's sweet spot is 3-4; higher values push the
  # model away from the reference images.
  guidance_scale: 3.5

  # video_prompt_type: "KI" for Klein Image generation.
  video_prompt_type: KI

  # Long-edge resolution in pixels. Short edge derived from panel
  # aspect ratio and snapped to nearest 64.
  base_resolution: 1024

  # Fixed seed for reproducibility. null = random per panel; an integer
  # locks all panels to the same seed which dramatically improves
  # character/style consistency when combined with consistent refs.
  seed: 42

  # Extra CLI flags passed to wgp.py (e.g. ["--attention", "sdpa"]).
  cli_args: []

  # Directory where Wan2GP looks for LoRA files. Defaults to
  # <wgp_root>/loras if not set. LoRA .safetensors registered in
  # lazycomics are auto-copied here so the headless CLI can find them.
  loras_dir: null

  # Inpaint settings (multi-character panels: a base pass paints the primary
  # character, then each additional character is inpainted into a masked region).
  #
  # denoising — fraction of the masked area regenerated. LOW values (0.15-0.35)
  #   paint the new character *into* the existing scene and keep the base
  #   panel's structure; HIGH values (0.6+) redraw the masked region from
  #   scratch, which is what made busy panels come out as two disjointed
  #   halves. 0.25 is the middle of the recommended range — lower it toward
  #   0.15 if characters still look pasted-on, raise it toward 0.35 if the new
  #   character paints in too weakly.
  inpaint_denoising: 0.25        # denoising_strength for inpaint passes
  inpaint_masking_strength: 0.3  # Wan2GP-side edge blending for inpaint mask
  inpaint_mask_expand: 0         # Wan2GP-side pixel dilation of mask boundary
  # feather — Gaussian-blur radius applied to the lazycomics-generated mask,
  #   as a fraction of the panel's short edge. Soft mask edges blend the
  #   inpaint into the surrounding art instead of leaving a hard seam. 0
  #   disables feathering (hard rounded edge).
  inpaint_mask_feather: 0.04


# ---------------------------------------------------------------------------
# Real-ESRGAN upscaler  (src/lazycomics/upscaler.py)
# ---------------------------------------------------------------------------
# Upscales assembled pages. Requires the realesrgan-ncnn-vulkan binary
# (portable, no Python/CUDA needed). Download from:
# https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan/releases
#
# NOTE: wan2gp.base_resolution above controls the IMAGE GENERATION
# resolution (long edge of each panel). The final print resolution is
# determined by the page assembly grid × this upscale factor.
# e.g. base_resolution: 1024 + 2×3 grid + 4× upscale ≈ 8192×12288px
upscaler:
  # Path to the binary (or just the name if it's on PATH).
  executable: realesrgan-ncnn-vulkan

  # Model name. Options:
  #   realesrgan-x4plus-anime  — anime/illustration 4x (best for comics)
  #   realesrgan-x4plus        — general photography 4x
  #   realesr-animevideov3     — anime 2x/3x/4x
  model: realesrgan-x4plus-anime

  # Upscale factor (fixed by model: 4 for x4plus variants).
  scale: 4

# ---------------------------------------------------------------------------
# Text overlay rendering  (src/lazycomics/text_renderer.py)
# ---------------------------------------------------------------------------
# Controls font sizes and speech-bubble tail length for the captions, SFX,
# and dialogue bubbles overlaid onto generated panels. Font sizes are a
# fraction of each panel's WIDTH (so they stay legible across small grid
# cells and large splash panels alike), then multiplied by font_scale and
# floored at min_font_px. To make ALL text bigger or smaller in one move,
# change font_scale; for finer control, tune the per-type ratios.
text:
  # Per-type font size as a fraction of panel width.
  dialogue_font_ratio: 0.030   # speech/thought/shout/whisper text
  caption_font_ratio: 0.028    # narrator caption boxes
  sfx_font_ratio: 0.050        # sound effects (kept large/punchy)

  # Floor so text never becomes illegible on a tiny panel.
  min_font_px: 16

  # Global multiplier applied on top of the ratios. Bump to ~1.2 if text
  # reads small in your panels, or ~0.85 if it reads large.
  font_scale: 1.0

  # Speech-bubble tail length as a fraction of the panel's SHORT edge,
  # floored at 16px. Comic tails are short stubs that indicate the speaker;
  # they do not stretch across the panel to touch the face.
  tail_frac: 0.05
